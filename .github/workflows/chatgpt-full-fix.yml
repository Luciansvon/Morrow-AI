name: Morrow CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies and project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install -e .
      - name: Launcher smoke test
        run: MORROW --help
      - name: Ruff verify
        run: ruff check . --output-format=github
      - name: Compile verify
        run: python -m compileall -q src scripts morrow_runtime.py
      - name: Diff whitespace verify
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^...HEAD
          else
            git show --check --format= HEAD
          fi
      - name: Audit acceptance contracts
        run: |
          pytest -q --tb=short \
            tests/test_audit_2026_08_19_fixes.py \
            tests/test_control_targeting.py
      - name: Tests
        shell: bash
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path("pytest-output.txt").read_text(encoding="utf-8", errors="replace")
          tail = "\n".join(text.splitlines()[-120:])
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=pytest failures::{escaped}")
          PY
          fi
          exit "$status"

  package:
    name: Package verified source
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage clean source package
        run: |
          set -euo pipefail
          rm -rf /tmp/Morrow-AI-verified
          mkdir -p /tmp/Morrow-AI-verified
          rsync -a \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            ./ /tmp/Morrow-AI-verified/
          if find /tmp/Morrow-AI-verified -type f -name '.env' -print -quit | grep -q .; then
            echo "::error::Release package contains a local .env file"
            exit 1
          fi
      - name: Upload verified full source
        uses: actions/upload-artifact@v4
        with:
          name: Morrow-AI-verified
          path: /tmp/Morrow-AI-verified
          include-hidden-files: true
          retention-days: 7
