name: Morrow CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies and project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install -e .
      - name: Launcher smoke test
        run: MORROW --help
      - name: Ruff verify
        run: ruff check . --fix --diff
      - name: Tests
        run: pytest -q

  package:
    name: Package verified source
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage clean source package
        run: |
          mkdir -p /tmp/Morrow-AI-verified
          rsync -a \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            ./ /tmp/Morrow-AI-verified/
      - name: Upload verified full source
        uses: actions/upload-artifact@v4
        with:
          name: Morrow-AI-verified
          path: /tmp/Morrow-AI-verified
          include-hidden-files: true
          retention-days: 7
