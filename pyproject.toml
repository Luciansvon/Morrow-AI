[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morrow"
version = "0.2.4"
description = "Private Multi-Agent Group Assistant (Morrow v0.2)"
authors = [{ name = "Bima" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.9,<0.2",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.2.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "puremagic>=1.22",
    "Pillow>=10.3.0",
    "tenacity>=8.3.0",
    "aiogram>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
MORROW = "src.launcher:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "BLE001", "S110", "ASYNC230", "RUF059", "SIM102", "S101"]
